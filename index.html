<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>西軽精機ナレッジ（仮）</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#b9741e">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root {
    --bg: #f1eee6; --surface: #ffffff; --surface-2: #f7f4ec;
    --ink: #1b1d1f; --ink-soft: #5b5850; --line: #ddd6c4;
    --accent: #b9741e; --accent-soft: #f3e2c4; --accent-ink: #6e4512;
    --alert: #b23b2e; --alert-soft: #f7e1dc; --alert-ink: #7a2a20;
    --ok: #3f7d53;
    --font-ui: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Roboto Mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  .hidden { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-ui); }
  #app { display: flex; flex-direction: column; min-height: 100vh; max-width: 900px; margin: 0 auto; }
  header.appbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--surface);
  }
  header.appbar .title { font-weight: 700; font-size: 1.05rem; }
  #userBox { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--ink-soft); }
  #signinBtn { display: none; }
  main { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .screen { display: none; flex-direction: column; gap: 16px; }
  .screen.active { display: flex; }

  .scan-copy { text-align: center; }
  .scan-copy h2 { font-size: 1.1rem; margin: 0 0 6px; }
  .scan-copy p { color: var(--ink-soft); font-size: 0.9rem; margin: 0; }
  #video { width: 100%; max-width: 340px; margin: 0 auto; border-radius: 16px; background: #000; display: block; }
  #camWrap { position: relative; width: 100%; max-width: 340px; margin: 0 auto; }
  #camWrap.hidden { display: none; }

  .btn { font-family: inherit; font-size: 0.95rem; font-weight: 700; border-radius: 12px; border: none; padding: 14px 16px; cursor: pointer; text-align: center; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { background: var(--surface-2); color: var(--ink-soft); cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px dashed var(--line); font-weight: 600; font-size: 0.85rem; }
  .btn-secondary { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); font-size: 0.85rem; padding: 12px 14px; }

  .manual-entry { display: none; flex-direction: column; gap: 8px; }
  .manual-entry.active { display: flex; }
  .manual-entry input {
    font-family: var(--font-mono); font-size: 0.95rem; padding: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }

  .zuban-header { font-family: var(--font-mono); font-weight: 700; color: var(--accent-ink); font-size: 1rem; }

  .alert-card { border: 1.5px solid var(--alert); background: var(--alert-soft); border-radius: 14px; padding: 14px; }
  .alert-card .alert-head { display: flex; align-items: center; gap: 7px; font-weight: 700; color: var(--alert-ink); font-size: 0.92rem; margin-bottom: 10px; }
  .alert-item { font-size: 0.85rem; background: var(--surface); border-radius: 9px; padding: 10px; margin-bottom: 8px; }
  .alert-item .date { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-soft); display: block; margin-bottom: 4px; }
  .alert-item a { color: var(--accent-ink); font-weight: 700; }
  .confirm-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 11px; background: var(--surface); border-radius: 10px; cursor: pointer; border: 1px solid var(--line); }
  .confirm-row input { width: 18px; height: 18px; accent-color: var(--alert); flex: none; }

  .firsttime-card { border: 1.5px dashed var(--accent); background: var(--accent-soft); border-radius: 14px; padding: 20px 14px; text-align: center; }
  .firsttime-card .big { font-size: 1.6rem; margin-bottom: 4px; }

  .section-label { font-size: 0.75rem; letter-spacing: 0.06em; color: var(--ink-soft); font-weight: 700; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 0.88rem; }

  .status-note { font-size: 0.78rem; color: var(--ink-soft); text-align: center; }
  .coming-soon { font-size: 0.8rem; color: var(--ink-soft); background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; }

  .recent-chip { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.85rem; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; cursor: pointer; }

  .candidate-select { display: flex; flex-direction: column; gap: 8px; }
  .candidate-select.hidden { display: none; }
  .candidate-item { display: flex; flex-direction: column; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .candidate-item .candidate-zuban { font-family: var(--font-mono); font-weight: 700; font-size: 0.9rem; }
  .candidate-item .candidate-hinmei { font-size: 0.78rem; color: var(--ink-soft); }

  /* ==== 共通部品（③ツール配置・⑤品質情報記録） ==== */
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label { font-size: 0.76rem; font-weight: 700; color: var(--ink-soft); }
  .mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mini-field { display: flex; flex-direction: column; gap: 4px; }
  .mini-field label { font-size: 0.68rem; font-weight: 700; color: var(--ink-soft); }
  .mini-field input {
    font-family: inherit; font-size: 0.8rem; padding: 8px 9px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-family: inherit; font-size: 0.8rem; font-weight: 600; padding: 8px 13px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  textarea {
    font-family: inherit; font-size: 0.88rem; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); resize: none; min-height: 76px; line-height: 1.5;
  }
  .photo-btn {
    display: flex; align-items: center; gap: 8px; border: 1px dashed var(--line); background: var(--surface);
    border-radius: 10px; padding: 11px 12px; font-size: 0.83rem; color: var(--ink-soft); font-weight: 600; cursor: pointer;
  }
  .photo-btn.has-photo { color: var(--ok); border-color: var(--ok); border-style: solid; }
  .tip-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
  .tip-card .tags { display: flex; gap: 5px; margin-bottom: 6px; flex-wrap: wrap; }
  .tip-card .tag { font-size: 0.68rem; background: var(--surface-2); color: var(--ink-soft); padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .tip-card p { font-size: 0.83rem; margin: 0 0 6px; }
  .tip-card .meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: var(--ink-soft); }
  .tip-card img.tip-photo { max-width: 100%; border-radius: 8px; margin-bottom: 6px; display: block; }

  /* ==== ③ ツール配置 ==== */
  .tools-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none; flex-wrap: wrap; }
  .tools-header .zuban-inline { font-family: var(--font-mono); font-weight: 700; color: var(--accent-ink); font-size: 0.95rem; }
  .tool-view-wrap, #toolEditWrap { display: flex; flex-direction: column; flex: 1; min-height: 0; gap: 10px; }
  .memo-zone { flex: 1 1 auto; min-height: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; }
  .memo-edit-wrap { flex: 1 1 auto; min-height: 90px; display: flex; flex-direction: column; gap: 8px; }
  .memo-edit-wrap .memo-zone { flex: 1 1 auto; min-height: 40px; }
  .memo-new-form { flex: none; display: flex; flex-direction: column; gap: 7px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .memo-new-form textarea { min-height: 56px; font-size: 0.85rem; }
  .tool-view-grid, .tool-edit-grid {
    flex: 0 0 auto; max-width: 100%; overflow-y: visible; overflow-x: hidden;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-content: start;
  }
  .tool-view-col, .tool-edit-col { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .tool-view-col .col-head {
    font-size: 0.78rem; font-weight: 700; color: var(--ink-soft); background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 6px; text-align: center; font-family: var(--font-mono); line-height: 1.35;
  }
  .tool-view-row { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 8px 9px; min-width: 0; overflow-wrap: anywhere; }
  .tool-view-row .t { font-family: var(--font-mono); font-size: 0.84rem; font-weight: 700; color: var(--accent-ink); display: block; }
  .tool-view-row .d { font-size: 0.82rem; color: var(--ink); display: block; margin-top: 3px; line-height: 1.45; overflow-wrap: anywhere; }
  .tool-view-spec { flex: none; display: flex; gap: 10px; flex-wrap: wrap; }
  .tool-view-spec .spec-item { flex: 1 1 160px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font-size: 0.8rem; color: var(--ink-soft); }
  .tool-view-spec .spec-item b { color: var(--ink); font-weight: 700; }

  .col-head-edit { display: flex; align-items: center; gap: 5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 7px; min-width: 0; }
  .col-head-edit .label { font-size: 0.72rem; font-weight: 700; color: var(--ink-soft); flex: 1; min-width: 0; line-height: 1.3; }
  .col-head-edit input {
    width: 44px; flex: none; min-width: 0; font-family: var(--font-mono); font-size: 0.76rem;
    text-align: center; padding: 4px 2px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .tool-edit-row { display: flex; align-items: center; gap: 4px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 6px; }
  .tool-edit-row .order-btns { display: flex; flex-direction: column; gap: 2px; flex: none; }
  .tool-edit-row .order-btns button {
    width: 18px; height: 14px; font-size: 0.58rem; line-height: 1; padding: 0; border: none; background: var(--surface-2); color: var(--ink-soft); border-radius: 4px; cursor: pointer;
  }
  .tool-edit-row .tnum {
    width: 40px; flex: none; min-width: 0; font-family: var(--font-mono); font-size: 0.76rem; font-weight: 700;
    text-align: center; padding: 6px 2px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  }
  .tool-edit-row .rdesc {
    flex: 1 1 0%; width: 0; min-width: 0; font-family: inherit; font-size: 0.8rem; padding: 6px 7px;
    border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .tool-edit-row .row-remove {
    flex: none; width: 20px; height: 20px; border: none; background: transparent; color: var(--ink-soft); font-size: 0.8rem; cursor: pointer; border-radius: 5px;
  }
  .tool-edit-row .row-remove:hover { background: var(--alert-soft); color: var(--alert); }
  .add-col-row-btn {
    font-family: inherit; border: 1px dashed var(--line); background: var(--surface); border-radius: 8px; padding: 6px; font-size: 0.74rem; font-weight: 600; color: var(--ink-soft); cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <header class="appbar">
    <span class="title">西軽精機ナレッジ（仮）</span>
    <div id="userBox">
      <span id="userLabel">未ログイン</span>
      <div id="g_id_signin"></div>
    </div>
  </header>

  <main>
    <!-- SCREEN 1: 図番読み取り -->
    <section class="screen active" data-screen="scan">
      <div class="scan-copy">
        <h2>作業票のQRを読み取る</h2>
        <p>I-PROが自動生成しているQRコードをそのまま使います</p>
      </div>
      <div id="camWrap" class="hidden">
        <video id="video" playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
      </div>
      <button class="btn btn-primary" id="startScanBtn">QRを読み取る</button>
      <button class="btn btn-ghost" id="manualToggleBtn">図番が読み取れない場合は直接入力</button>
      <div class="manual-entry" id="manualEntry">
        <input type="text" id="manualZubanInput" placeholder="例：9081-6120-Z000">
        <button class="btn btn-secondary" id="manualGoBtn">この図番で進む</button>
      </div>
      <div class="candidate-select hidden" id="candidateSelect">
        <div class="section-label">この製番に対応する図番が複数見つかりました。選んでください</div>
        <div id="candidateList"></div>
      </div>
      <div id="recentList"></div>
      <div class="status-note" id="scanStatus"></div>
    </section>

    <!-- SCREEN 2: 過去情報表示 -->
    <section class="screen" data-screen="history">
      <div class="zuban-header" id="historyZubanHeader"></div>

      <div id="pastTroubleWrap" style="display:none;">
        <div class="alert-card">
          <div class="alert-head">⚠ 過去トラがあります</div>
          <div id="pastTroubleList"></div>
          <label class="confirm-row" id="confirmRow">
            <input type="checkbox" id="confirmCheck">
            <span>内容を確認しました</span>
          </label>
        </div>
      </div>

      <div id="freshWrap" style="display:none;">
        <div class="firsttime-card">
          <div class="big">🔰</div>
          <p><strong>あなたが初挑戦です！</strong></p>
          <p>この図番の記録はまだありません。</p>
        </div>
      </div>

      <div id="qualityLogSection" style="display:none;">
        <div class="section-label">自部署の品質情報</div>
        <div id="qualityLogList"></div>
      </div>

      <div id="actionButtons" style="display:flex; flex-direction:column; gap:10px;">
        <button class="btn btn-primary hidden" id="goToolsBtn">ツール配置を見る・編集する</button>
        <button class="btn btn-secondary hidden" id="openInspectionFolderBtn">検査記録フォルダを開く</button>
      </div>
      <div class="coming-soon">④紙の取込確認・⑤品質情報記録の各画面は近日追加予定です。</div>
      <button class="btn btn-secondary" id="backToScanBtn">別の図番を読み取る</button>
    </section>

    <!-- SCREEN 3: ツール配置 -->
    <section class="screen" data-screen="tools">
      <div class="tools-header">
        <span class="zuban-inline" id="toolsZubanHeader"></span>
        <button type="button" class="btn btn-secondary" id="toolViewToggle">編集する</button>
      </div>

      <div class="tool-view-wrap" id="toolViewWrap">
        <div class="memo-zone" id="memoZone"></div>
        <div class="tool-view-grid">
          <div class="tool-view-col" id="toolViewFront"><div class="col-head" id="toolViewFrontHead">正面チャック径</div></div>
          <div class="tool-view-col" id="toolViewBack"><div class="col-head" id="toolViewBackHead">背面チャック径</div></div>
          <div class="tool-view-col" id="toolViewCycle"><div class="col-head" id="toolViewCycleHead">サイクルタイム</div></div>
        </div>
        <div class="tool-view-spec" id="toolViewSpec"></div>
      </div>

      <div id="toolEditWrap" class="hidden">
        <div class="memo-edit-wrap">
          <div class="memo-zone" id="memoEditList"></div>
          <div class="memo-new-form">
            <textarea id="toolMemoNew" placeholder="新しく記録する内容（日付は自動で付きます）"></textarea>
            <button type="button" class="photo-btn" id="memoPhotoBtn"><span id="memoPhotoIcon">📷</span><span id="memoPhotoLabel">写真を選ぶ</span></button>
            <input type="file" id="memoPhotoInput" accept="image/*" class="hidden">
            <label class="confirm-row">
              <input type="checkbox" id="memoShareCheck">
              <span>他部署にも共有する（②の過去トラに表示され、全員が確認必須になります）</span>
            </label>
            <button type="button" class="btn btn-secondary" id="memoAddBtn">この内容を記録する</button>
          </div>
        </div>

        <div class="tool-edit-grid" id="toolEditGrid">
          <div class="tool-edit-col" id="editColFront">
            <div class="col-head-edit"><span class="label">正面チャック径</span><input type="text" id="frontChuckInput"></div>
            <div class="edit-rows" id="editRowsFront"></div>
            <button type="button" class="add-col-row-btn" data-col="front">＋ 追加</button>
          </div>
          <div class="tool-edit-col" id="editColBack">
            <div class="col-head-edit"><span class="label">背面チャック径</span><input type="text" id="backChuckInput"></div>
            <div class="edit-rows" id="editRowsBack"></div>
            <button type="button" class="add-col-row-btn" data-col="back">＋ 追加</button>
          </div>
          <div class="tool-edit-col" id="editColCycle">
            <div class="col-head-edit"><span class="label">サイクルタイム</span><input type="text" id="cycleTimeInput"></div>
            <div class="edit-rows" id="editRowsCycle"></div>
            <button type="button" class="add-col-row-btn" data-col="cycle">＋ 追加</button>
          </div>
        </div>

        <div class="mini-grid" style="margin-top:10px;">
          <div class="mini-field"><label>専用ツール保管</label><input type="text" id="toolStorageInput"></div>
          <div class="mini-field"><label>前進端位置</label><input type="text" id="forwardPositionInput"></div>
        </div>

        <button type="button" class="btn btn-primary" id="toolSaveBtn" style="margin-top:10px;">この内容で保存する</button>
      </div>

      <div class="status-note" id="toolsStatus"></div>
      <button class="btn btn-secondary" id="toolsBackBtn">②に戻る</button>
    </section>
  </main>
</div>

<script>
  // ==== 設定 ====
  // GAS Web App（デプロイ済み）のURL
  var GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzqgdS5B5jlg5M11acnfkQAhfk_8Rso7R70CQ37LGUqVMakL9MQva1Dn_sm8p3Upo-a/exec';
  // TODO: Google OAuthクライアントID未設定（実装ページ.md「投稿者の識別」参照）。
  // 共有GCPプロジェクト(800178947678)に追加後、ここに設定すること。未設定の間はサインインボタンが機能しない。
  var GOOGLE_CLIENT_ID = '';

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }

  // ==== 画面切り替え ====
  function setScreen(name) {
    document.querySelectorAll('.screen').forEach(function (el) {
      el.classList.toggle('active', el.dataset.screen === name);
    });
  }

  // ==== ログイン（Google Identity Services） ====
  var currentUser = null; // { email, name }

  function initSignIn() {
    if (!GOOGLE_CLIENT_ID) {
      document.getElementById('userLabel').textContent = '未ログイン（OAuth未設定）';
      return;
    }
    if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) {
      setTimeout(initSignIn, 300);
      return;
    }
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleCredentialResponse,
      auto_select: true
    });
    google.accounts.id.renderButton(document.getElementById('g_id_signin'), { theme: 'outline', size: 'small' });
    google.accounts.id.prompt(); // 自動ログインを試みる（One Tap）
  }

  function handleCredentialResponse(response) {
    // TODO: 本番ではidTokenをGAS側に送って検証すること（今はクライアント側でデコードして表示するだけ）。
    var payload = JSON.parse(atob(response.credential.split('.')[1]));
    currentUser = { email: payload.email, name: payload.name };
    document.getElementById('userLabel').textContent = currentUser.name + '（' + currentUser.email + '）';
    fetchRole();
  }

  // ==== 役割判定（組織図マスタと照合。③④⑤の出し分けに使う） ====
  var currentRole = null; // seizou / kensa / seisan / shukka / other
  function fetchRole() {
    if (!currentUser) return;
    fetch(GAS_API_URL + '?action=role&email=' + encodeURIComponent(currentUser.email))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        currentRole = data.role || 'other';
        updateActionGate();
      })
      .catch(function () { currentRole = 'other'; updateActionGate(); });
  }

  // ==== recent list（localStorageに保存） ====
  function getRecentZubans() {
    try { return JSON.parse(localStorage.getItem('recentZubans') || '[]'); } catch (e) { return []; }
  }
  function pushRecentZuban(zuban) {
    var list = getRecentZubans().filter(function (z) { return z !== zuban; });
    list.unshift(zuban);
    localStorage.setItem('recentZubans', JSON.stringify(list.slice(0, 5)));
    renderRecentList();
  }
  function renderRecentList() {
    var wrap = document.getElementById('recentList');
    wrap.innerHTML = '';
    getRecentZubans().forEach(function (z) {
      var div = document.createElement('div');
      div.className = 'recent-chip';
      div.textContent = z;
      div.addEventListener('click', function () { goToZuban(z); });
      wrap.appendChild(div);
    });
  }

  // ==== QRスキャン ====
  var scanning = false;
  var stream = null;
  document.getElementById('startScanBtn').addEventListener('click', startScan);

  function startScan() {
    var camWrap = document.getElementById('camWrap');
    var video = document.getElementById('video');
    camWrap.classList.remove('hidden');
    document.getElementById('scanStatus').textContent = 'カメラを起動しています…';
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function (s) {
      stream = s;
      video.srcObject = s;
      video.setAttribute('playsinline', true);
      video.play();
      scanning = true;
      document.getElementById('scanStatus').textContent = 'QRコードを枠内に写してください';
      requestAnimationFrame(scanTick);
    }).catch(function (err) {
      document.getElementById('scanStatus').textContent = 'カメラを起動できませんでした: ' + err.message;
    });
  }

  function stopScan() {
    scanning = false;
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    document.getElementById('camWrap').classList.add('hidden');
  }

  function scanTick() {
    if (!scanning) return;
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code && code.data) {
        stopScan();
        handleScannedUrl(code.data);
        return;
      }
    }
    requestAnimationFrame(scanTick);
  }

  function handleScannedUrl(qrText) {
    // I-PROのQRは 192.168.0.131/workresult/index/{工程}/{製番} のようなURL。
    // 末尾のパス要素が製番。製番→図番の変換はGAS側(resolveZuban)で行う。
    var parts = qrText.split('/').filter(Boolean);
    var seiban = parts[parts.length - 1] || qrText;
    hideCandidateSelect();
    document.getElementById('scanStatus').textContent = '図番を確認しています…';

    fetch(GAS_API_URL + '?action=resolveZuban&seiban=' + encodeURIComponent(seiban))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) {
          document.getElementById('scanStatus').textContent = '変換に失敗しました: ' + data.error;
          return;
        }
        if (!data.found) {
          document.getElementById('scanStatus').textContent =
            '製番「' + seiban + '」に対応する図番が見つかりませんでした。直接入力してください。';
          return;
        }
        document.getElementById('scanStatus').textContent = '';
        if (data.multiple) {
          showCandidateSelect(data.candidates);
          return;
        }
        goToZuban(data.zuban);
      })
      .catch(function (err) {
        document.getElementById('scanStatus').textContent = '変換に失敗しました: ' + err.message;
      });
  }

  function showCandidateSelect(candidates) {
    var list = document.getElementById('candidateList');
    list.innerHTML = '';
    candidates.forEach(function (c) {
      var div = document.createElement('div');
      div.className = 'candidate-item';
      div.innerHTML = '<span class="candidate-zuban">' + escapeHtml(c.zuban) + '</span>' +
        (c.hinmei ? '<span class="candidate-hinmei">' + escapeHtml(c.hinmei) + '</span>' : '');
      div.addEventListener('click', function () {
        hideCandidateSelect();
        goToZuban(c.zuban);
      });
      list.appendChild(div);
    });
    document.getElementById('candidateSelect').classList.remove('hidden');
  }

  function hideCandidateSelect() {
    document.getElementById('candidateSelect').classList.add('hidden');
  }

  // ==== 手入力 ====
  document.getElementById('manualToggleBtn').addEventListener('click', function () {
    document.getElementById('manualEntry').classList.toggle('active');
  });
  document.getElementById('manualGoBtn').addEventListener('click', function () {
    var v = document.getElementById('manualZubanInput').value.trim();
    if (v) goToZuban(v);
  });

  document.getElementById('backToScanBtn').addEventListener('click', function () {
    setScreen('scan');
  });

  // ==== 図番確定 → ②画面へ ====
  function goToZuban(zuban) {
    hideCandidateSelect();
    pushRecentZuban(zuban);
    setScreen('history');
    document.getElementById('historyZubanHeader').textContent = zuban + '（品名取得は未実装）';
    document.getElementById('pastTroubleWrap').style.display = 'none';
    document.getElementById('freshWrap').style.display = 'none';
    document.getElementById('qualityLogSection').style.display = 'none';
    document.getElementById('pastTroubleList').innerHTML = '<p class="status-note">読み込み中…</p>';
    document.getElementById('pastTroubleWrap').style.display = 'block';

    fetch(GAS_API_URL + '?action=zubanInfo&zuban=' + encodeURIComponent(zuban))
      .then(function (r) { return r.json(); })
      .then(renderZubanInfo)
      .catch(function (err) {
        document.getElementById('pastTroubleList').innerHTML = '<p class="status-note">取得に失敗しました: ' + err.message + '</p>';
      });
  }

  var currentZubanData = null;
  var currentInspectionFolderUrl = null;

  function renderZubanInfo(data) {
    if (data.error) {
      document.getElementById('pastTroubleList').innerHTML = '<p class="status-note">エラー: ' + data.error + '</p>';
      return;
    }
    currentZubanData = data;
    currentInspectionFolderUrl = null;
    document.getElementById('historyZubanHeader').textContent = zubanLabel(data);

    var hasTrouble = (data.pastTrouble || []).length > 0;
    document.getElementById('pastTroubleWrap').style.display = hasTrouble ? 'block' : 'none';
    document.getElementById('freshWrap').style.display = (!hasTrouble && (data.qualityLog || []).length === 0) ? 'block' : 'none';

    if (hasTrouble) {
      var list = document.getElementById('pastTroubleList');
      list.innerHTML = '';
      data.pastTrouble.forEach(function (item) {
        var div = document.createElement('div');
        div.className = 'alert-item';
        var titleText = item.title || (item.row && item.row['内容']) || item.source;
        var link = item.url ? '<br><a href="' + item.url + '" target="_blank" rel="noopener">詳細を見る（元シートを開く）</a>' : '';
        div.innerHTML = '<span class="date">' + (item.source || '') + '</span>' + escapeHtml(String(titleText)) + link;
        list.appendChild(div);
      });
    }

    var confirmCheck = document.getElementById('confirmCheck');
    confirmCheck.checked = false;

    var qlSection = document.getElementById('qualityLogSection');
    var qlList = document.getElementById('qualityLogList');
    if ((data.qualityLog || []).length > 0) {
      qlSection.style.display = 'block';
      qlList.innerHTML = '';
      data.qualityLog.forEach(function (row) {
        var div = document.createElement('div');
        div.className = 'card';
        div.textContent = (row['内容'] || '');
        qlList.appendChild(div);
      });
    } else {
      qlSection.style.display = 'none';
    }

    updateActionGate();
  }

  document.getElementById('confirmCheck').addEventListener('change', updateActionGate);

  // ==== ②画面：役割・過去トラ確認状況に応じたボタンの出し分け（確認するまで押せない） ====
  function updateActionGate() {
    var goToolsBtn = document.getElementById('goToolsBtn');
    var openInspectionFolderBtn = document.getElementById('openInspectionFolderBtn');
    if (!currentZubanData) {
      goToolsBtn.classList.add('hidden');
      openInspectionFolderBtn.classList.add('hidden');
      return;
    }
    var hasTrouble = (currentZubanData.pastTrouble || []).length > 0;
    var confirmed = hasTrouble ? document.getElementById('confirmCheck').checked : true;

    goToolsBtn.classList.toggle('hidden', currentRole !== 'seizou');
    goToolsBtn.disabled = !confirmed;

    var isKensa = currentRole === 'kensa';
    openInspectionFolderBtn.classList.toggle('hidden', !isKensa);
    openInspectionFolderBtn.disabled = !confirmed;
    if (isKensa && currentInspectionFolderUrl === null) {
      fetch(GAS_API_URL + '?action=inspectionFolder&zuban=' + encodeURIComponent(currentZubanData.zuban))
        .then(function (r) { return r.json(); })
        .then(function (d) { currentInspectionFolderUrl = d.found ? d.url : ''; });
    }
  }

  document.getElementById('goToolsBtn').addEventListener('click', function () {
    if (this.disabled) return;
    goToTools();
  });
  document.getElementById('openInspectionFolderBtn').addEventListener('click', function () {
    if (this.disabled) return;
    if (currentInspectionFolderUrl) {
      window.open(currentInspectionFolderUrl, '_blank');
    } else if (currentInspectionFolderUrl === '') {
      alert('この図番の検査記録フォルダが見つかりませんでした（未作成の可能性があります）');
    } else {
      alert('確認中です。少し待ってからもう一度お試しください');
    }
  });

  function zubanLabel(data) {
    return data.zuban + (data.hinmei ? '　' + data.hinmei : '');
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ==== ③ ツール配置 ====
  var toolEditMode = false;
  var toolPositionsState = { front: [], back: [], cycle: [] };
  var pendingMemoPhotoUrl = '';
  var COL_LABELS = { front: '正面チャック径', back: '背面チャック径', cycle: 'サイクルタイム' };

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function escapeAttr(s) { return escapeHtml(String(s || '')); }

  function goToTools() {
    if (!currentZubanData) return;
    setScreen('tools');
    document.getElementById('toolsZubanHeader').textContent = zubanLabel(currentZubanData);
    document.getElementById('toolsStatus').textContent = '';
    toolEditMode = false;
    document.getElementById('toolViewToggle').textContent = '編集する';
    document.getElementById('toolViewWrap').classList.remove('hidden');
    document.getElementById('toolEditWrap').classList.add('hidden');
    renderToolView(currentZubanData);
  }

  document.getElementById('toolsBackBtn').addEventListener('click', function () {
    setScreen('history');
  });

  function refreshZubanData() {
    return fetch(GAS_API_URL + '?action=zubanInfo&zuban=' + encodeURIComponent(currentZubanData.zuban))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.error) currentZubanData = data;
      });
  }

  function groupToolPositions(positions) {
    var out = { front: [], back: [], cycle: [] };
    (positions || []).forEach(function (p) {
      if (out[p['列区分']]) out[p['列区分']].push(p);
    });
    ['front', 'back', 'cycle'].forEach(function (k) {
      out[k].sort(function (a, b) { return (Number(a['順番']) || 0) - (Number(b['順番']) || 0); });
    });
    return out;
  }

  function firstPositionValue(positions, key) {
    return (positions && positions.length > 0) ? (positions[0][key] || '') : '';
  }

  function formatDate(ts) {
    var d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    return "'" + String(d.getFullYear()).slice(2) + '/' + (d.getMonth() + 1) + '/' + d.getDate();
  }

  function toPreviewUrl(driveUrl) {
    var m = /\/d\/([^/]+)/.exec(driveUrl || '');
    return m ? ('https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w600') : driveUrl;
  }

  function buildTipCard(m) {
    var div = document.createElement('div');
    div.className = 'tip-card';
    var sharedTag = m['共有フラグ'] === true
      ? '<span class="tag" style="background:var(--accent-soft);color:var(--accent-ink);">共有済み</span>' : '';
    var photoHtml = m['写真URL'] ? '<img class="tip-photo" src="' + escapeAttr(toPreviewUrl(m['写真URL'])) + '" alt="">' : '';
    div.innerHTML =
      '<div class="tags"><span class="tag">' + formatDate(m['タイムスタンプ']) + '</span>' + sharedTag + '</div>' +
      photoHtml +
      '<p>' + escapeHtml(m['内容'] || '') + '</p>' +
      '<div class="meta"><span>投稿：' + escapeHtml(m['投稿者名'] || '') + '</span></div>';
    return div;
  }

  function renderToolView(data) {
    var memoZone = document.getElementById('memoZone');
    memoZone.innerHTML = '';
    var memos = (data.toolMemo || []).slice().sort(function (a, b) { return new Date(a['タイムスタンプ']) - new Date(b['タイムスタンプ']); });
    if (memos.length === 0) {
      memoZone.innerHTML = '<p class="status-note">まだ記録がありません</p>';
    } else {
      memos.forEach(function (m) { memoZone.appendChild(buildTipCard(m)); });
    }

    var grouped = groupToolPositions(data.toolPositions);
    ['front', 'back', 'cycle'].forEach(function (colKey) {
      var headEl = document.getElementById('toolView' + capitalize(colKey) + 'Head');
      var chuckVal = firstPositionValue(data.toolPositions, COL_LABELS[colKey]);
      headEl.textContent = COL_LABELS[colKey] + (chuckVal ? '　' + chuckVal : '');

      var colEl = document.getElementById('toolView' + capitalize(colKey));
      Array.prototype.slice.call(colEl.querySelectorAll('.tool-view-row')).forEach(function (el) { el.remove(); });
      grouped[colKey].forEach(function (p) {
        var row = document.createElement('div');
        row.className = 'tool-view-row';
        row.innerHTML = '<span class="t">' + escapeHtml(p['Tナンバー'] || '') + '</span><span class="d">' + escapeHtml(p['工具説明'] || '') + '</span>';
        colEl.appendChild(row);
      });
    });

    var specWrap = document.getElementById('toolViewSpec');
    specWrap.innerHTML = '';
    var storage = firstPositionValue(data.toolPositions, '専用ツール保管');
    var forwardPos = firstPositionValue(data.toolPositions, '前進端位置');
    if (storage) specWrap.insertAdjacentHTML('beforeend', '<div class="spec-item">専用ツール保管　<b>' + escapeHtml(storage) + '</b></div>');
    if (forwardPos) specWrap.insertAdjacentHTML('beforeend', '<div class="spec-item">前進端位置　<b>' + escapeHtml(forwardPos) + '</b></div>');
  }

  document.getElementById('toolViewToggle').addEventListener('click', function () {
    if (!toolEditMode) enterToolEdit(); else exitToolEdit();
  });

  function enterToolEdit() {
    toolEditMode = true;
    document.getElementById('toolViewToggle').textContent = '閲覧に戻る';
    document.getElementById('toolViewWrap').classList.add('hidden');
    document.getElementById('toolEditWrap').classList.remove('hidden');

    var grouped = groupToolPositions(currentZubanData.toolPositions);
    ['front', 'back', 'cycle'].forEach(function (colKey) {
      toolPositionsState[colKey] = grouped[colKey].map(function (p) {
        return { tNumber: p['Tナンバー'] || '', description: p['工具説明'] || '' };
      });
    });
    document.getElementById('frontChuckInput').value = firstPositionValue(currentZubanData.toolPositions, '正面チャック径');
    document.getElementById('backChuckInput').value = firstPositionValue(currentZubanData.toolPositions, '背面チャック径');
    document.getElementById('cycleTimeInput').value = firstPositionValue(currentZubanData.toolPositions, 'サイクルタイム');
    document.getElementById('toolStorageInput').value = firstPositionValue(currentZubanData.toolPositions, '専用ツール保管');
    document.getElementById('forwardPositionInput').value = firstPositionValue(currentZubanData.toolPositions, '前進端位置');

    renderEditColumn('front');
    renderEditColumn('back');
    renderEditColumn('cycle');

    renderMemoEditList();
    document.getElementById('toolMemoNew').value = '';
    document.getElementById('memoShareCheck').checked = false;
    resetMemoPhotoBtn();
  }

  function exitToolEdit() {
    toolEditMode = false;
    document.getElementById('toolViewToggle').textContent = '編集する';
    document.getElementById('toolViewWrap').classList.remove('hidden');
    document.getElementById('toolEditWrap').classList.add('hidden');
    renderToolView(currentZubanData);
  }

  function renderEditColumn(colKey) {
    var container = document.getElementById('editRows' + capitalize(colKey));
    container.innerHTML = '';
    toolPositionsState[colKey].forEach(function (row, idx) {
      var div = document.createElement('div');
      div.className = 'tool-edit-row';
      div.innerHTML =
        '<div class="order-btns"><button type="button" data-act="up">▲</button><button type="button" data-act="down">▼</button></div>' +
        '<input type="text" class="tnum" value="' + escapeAttr(row.tNumber) + '" placeholder="T番">' +
        '<input type="text" class="rdesc" value="' + escapeAttr(row.description) + '" placeholder="工具の説明">' +
        '<button type="button" class="row-remove">✕</button>';
      div.querySelector('[data-act="up"]').addEventListener('click', function () { moveRow(colKey, idx, -1); });
      div.querySelector('[data-act="down"]').addEventListener('click', function () { moveRow(colKey, idx, 1); });
      div.querySelector('.row-remove').addEventListener('click', function () { removeRow(colKey, idx); });
      container.appendChild(div);
    });
  }

  function syncColumnFromDom(colKey) {
    var container = document.getElementById('editRows' + capitalize(colKey));
    var arr = [];
    container.querySelectorAll('.tool-edit-row').forEach(function (row) {
      arr.push({ tNumber: row.querySelector('.tnum').value, description: row.querySelector('.rdesc').value });
    });
    toolPositionsState[colKey] = arr;
  }

  document.querySelectorAll('.add-col-row-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var colKey = btn.getAttribute('data-col');
      syncColumnFromDom(colKey);
      toolPositionsState[colKey].push({ tNumber: '', description: '' });
      renderEditColumn(colKey);
    });
  });

  function removeRow(colKey, idx) {
    syncColumnFromDom(colKey);
    toolPositionsState[colKey].splice(idx, 1);
    renderEditColumn(colKey);
  }

  function moveRow(colKey, idx, dir) {
    syncColumnFromDom(colKey);
    var arr = toolPositionsState[colKey];
    var newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= arr.length) return;
    var tmp = arr[idx]; arr[idx] = arr[newIdx]; arr[newIdx] = tmp;
    renderEditColumn(colKey);
  }

  document.getElementById('toolSaveBtn').addEventListener('click', function () {
    if (!currentUser) { alert('保存にはGoogleログインが必要です'); return; }
    syncColumnFromDom('front');
    syncColumnFromDom('back');
    syncColumnFromDom('cycle');

    var positions = [];
    ['front', 'back', 'cycle'].forEach(function (colKey) {
      toolPositionsState[colKey].forEach(function (row, idx) {
        if (!row.tNumber && !row.description) return;
        positions.push({ column: colKey, order: idx + 1, tNumber: row.tNumber, description: row.description });
      });
    });

    var payload = {
      action: 'saveToolPositions',
      zuban: currentZubanData.zuban,
      positions: positions,
      frontChuck: document.getElementById('frontChuckInput').value,
      backChuck: document.getElementById('backChuckInput').value,
      cycleTime: document.getElementById('cycleTimeInput').value,
      toolStorage: document.getElementById('toolStorageInput').value,
      forwardPosition: document.getElementById('forwardPositionInput').value,
      userEmail: currentUser.email
    };

    document.getElementById('toolsStatus').textContent = '保存しています…';
    fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.error) { document.getElementById('toolsStatus').textContent = '保存に失敗しました: ' + res.error; return Promise.reject(res.error); }
        return refreshZubanData();
      })
      .then(function () {
        document.getElementById('toolsStatus').textContent = '保存しました';
        exitToolEdit();
      })
      .catch(function (err) {
        if (err) document.getElementById('toolsStatus').textContent = '保存に失敗しました: ' + err;
      });
  });

  function renderMemoEditList() {
    var wrap = document.getElementById('memoEditList');
    wrap.innerHTML = '';
    var memos = (currentZubanData.toolMemo || []).slice().sort(function (a, b) { return new Date(a['タイムスタンプ']) - new Date(b['タイムスタンプ']); });
    if (memos.length === 0) { wrap.innerHTML = '<p class="status-note">まだ記録がありません</p>'; return; }
    memos.forEach(function (m) { wrap.appendChild(buildTipCard(m)); });
  }

  function resetMemoPhotoBtn() {
    pendingMemoPhotoUrl = '';
    document.getElementById('memoPhotoIcon').textContent = '📷';
    document.getElementById('memoPhotoLabel').textContent = '写真を選ぶ';
    document.getElementById('memoPhotoBtn').classList.remove('has-photo');
    document.getElementById('memoPhotoInput').value = '';
  }

  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result.split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('memoPhotoBtn').addEventListener('click', function () {
    document.getElementById('memoPhotoInput').click();
  });

  document.getElementById('memoPhotoInput').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file || !currentZubanData) return;
    var label = document.getElementById('memoPhotoLabel');
    label.textContent = 'アップロード中…';
    fileToBase64(file).then(function (base64) {
      return fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'uploadPhoto', zuban: currentZubanData.zuban,
          filename: file.name, mimeType: file.type, dataBase64: base64
        })
      });
    }).then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.error) { label.textContent = '写真を選ぶ'; alert('写真のアップロードに失敗しました: ' + res.error); return; }
        pendingMemoPhotoUrl = res.url;
        document.getElementById('memoPhotoIcon').textContent = '✅';
        label.textContent = '写真を添付しました';
        document.getElementById('memoPhotoBtn').classList.add('has-photo');
      })
      .catch(function (err) { label.textContent = '写真を選ぶ'; alert('写真のアップロードに失敗しました: ' + err.message); });
  });

  document.getElementById('memoAddBtn').addEventListener('click', function () {
    if (!currentUser) { alert('記録にはGoogleログインが必要です'); return; }
    var content = document.getElementById('toolMemoNew').value.trim();
    if (!content) { alert('内容を入力してください'); return; }
    var payload = {
      action: 'postToolMemo', zuban: currentZubanData.zuban,
      userEmail: currentUser.email, userName: currentUser.name,
      content: content, photoUrl: pendingMemoPhotoUrl,
      shared: document.getElementById('memoShareCheck').checked
    };
    fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.error) { alert('記録に失敗しました: ' + res.error); return Promise.reject(); }
        document.getElementById('toolMemoNew').value = '';
        document.getElementById('memoShareCheck').checked = false;
        resetMemoPhotoBtn();
        return refreshZubanData();
      })
      .then(function () { renderMemoEditList(); })
      .catch(function (err) { if (err) alert('記録に失敗しました: ' + err.message); });
  });

  renderRecentList();
  initSignIn();
</script>
</body>
</html>
