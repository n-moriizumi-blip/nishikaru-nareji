<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工程内不良ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    /* 西軽精機ナレッジ本体（index.html）と同じ「計測盤スタイル」のトークンをそのまま使う */
    --bg: #100F0D;
    --surface: #1B1A16;
    --surface-2: #242220;
    --ink: #EDE7D9;
    --ink-soft: #9B9686;
    --line: #37352E;
    --accent: #EDA23E;
    --accent-soft: #2E2216;
    --accent-ink: #F0AC49;
    --alert: #E0533D;
    --ok: #9BC48A;
    --info: #7EB6D9;
    /* dataviz skillで検証済みのカテゴリカル配色（この背景色#1B1A16に対し全チェックPASS）。
       大分類4種（刃物欠け・折れ／寸法不良／外観不良／その他）に固定順で割り当てる。 */
    --series-blade: #3987e5;
    --series-dim: #d95926;
    --series-look: #199e70;
    --series-other: #c98500;
    --tooltip-bg: #EDE7D9;
    --tooltip-fg: #100F0D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "BIZ UDPGothic", "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    line-height: 1.6;
  }
  .mono { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }

  header.appbar {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 18px 20px; border-bottom: 1px solid var(--line); background: var(--surface);
  }
  header.appbar .eyebrow {
    display: block; font-size: 0.68rem; letter-spacing: .12em; color: var(--accent);
    font-weight: 700; margin-bottom: 4px; text-transform: uppercase;
  }
  header.appbar h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }
  header.appbar .updated { font-size: 0.72rem; color: var(--ink-soft); }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 20px 64px; }
  @media (max-width: 760px) { .wrap { padding: 16px 14px 48px; } }

  .status-banner {
    background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
    padding: 28px 18px; text-align: center; color: var(--ink-soft); font-size: 0.9rem; margin-bottom: 18px;
  }

  /* KPIタイル：3枚のみ・非対称に大小つけて並べる（均一3カラムの既定感を避ける） */
  .kpi-row { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 12px; margin-bottom: 26px; }
  @media (max-width: 600px) { .kpi-row { grid-template-columns: 1fr; } }
  .kpi-tile {
    background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px;
  }
  .kpi-tile .label { font-size: 0.72rem; color: var(--ink-soft); font-weight: 700; margin-bottom: 6px; }
  .kpi-tile .value { font-size: 2.1rem; font-weight: 700; color: var(--accent-ink); }
  .kpi-tile .unit { font-size: 0.82rem; color: var(--ink-soft); margin-left: 4px; }

  .section {
    background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
    padding: 18px 20px 20px; margin-bottom: 20px;
  }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .section-head h2 { margin: 0; font-size: 0.98rem; font-weight: 700; }
  .section-head h2 .bar { display: inline-block; width: 4px; height: 14px; background: var(--accent); margin-right: 8px; vertical-align: -2px; border-radius: 1px; }
  .toggle-btn {
    appearance: none; border: 1px dashed var(--ink-soft); background: transparent; color: var(--ink-soft);
    font: inherit; font-size: 0.72rem; font-weight: 700; padding: 5px 10px; border-radius: 4px; cursor: pointer;
  }
  .toggle-btn:hover { color: var(--ink); border-color: var(--ink); }
  .empty-note { color: var(--ink-soft); font-size: 0.84rem; padding: 10px 0; }

  /* バーチャート */
  .bar-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .bar-row .bar-label { flex: 0 0 150px; font-size: 0.78rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-row .bar-track { flex: 1; background: var(--surface-2); border-radius: 3px; height: 20px; position: relative; overflow: hidden; }
  .bar-row .bar-fill { height: 100%; border-radius: 3px; transition: filter .15s; }
  .bar-row .bar-fill:hover { filter: brightness(1.18); }
  .bar-row .bar-value { flex: 0 0 44px; text-align: right; font-size: 0.8rem; font-weight: 700; color: var(--ink); }

  /* 月別推移バー */
  .month-chart { display: flex; align-items: flex-end; gap: 10px; height: 180px; padding: 0 4px 24px; position: relative; }
  .month-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 28px; }
  .month-col .val { font-size: 0.72rem; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .month-col .bar { width: 60%; border-radius: 3px 3px 0 0; min-height: 2px; transition: filter .15s; }
  .month-col .bar:hover { filter: brightness(1.18); }
  .month-col .label { position: absolute; bottom: 0; font-size: 0.68rem; color: var(--ink-soft); transform: translateY(20px); }

  /* 円グラフ＋凡例 */
  .donut-wrap { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .donut-wrap svg { flex: 0 0 180px; }
  .legend { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 180px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .legend-item .name { flex: 1; color: var(--ink); }
  .legend-item .pct { font-weight: 700; color: var(--ink); }

  /* テーブル */
  table.data-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  table.data-table th, table.data-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; }
  table.data-table th:first-child, table.data-table td:first-child,
  table.data-table th:nth-child(2), table.data-table td:nth-child(2) { text-align: left; }
  table.data-table th { color: var(--ink-soft); font-weight: 700; font-size: 0.72rem; }
  table.data-table td.zuban { font-weight: 700; color: var(--accent-ink); }
  table.data-table td.rate-high { color: var(--alert); font-weight: 700; }

  .tooltip {
    position: fixed; pointer-events: none; background: var(--tooltip-bg); color: var(--tooltip-fg);
    font-size: 0.76rem; padding: 6px 9px; border-radius: 4px; z-index: 50; opacity: 0; transition: opacity .1s;
    white-space: nowrap; font-weight: 700;
  }
  .tooltip.show { opacity: 1; }

  .foot-note { font-size: 0.72rem; color: var(--ink-soft); text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<header class="appbar">
  <div>
    <span class="eyebrow">西軽精機ナレッジ</span>
    <h1>工程内不良ダッシュボード</h1>
  </div>
  <div class="updated mono" id="updatedAt"></div>
</header>

<div class="wrap">
  <div id="statusBanner" class="status-banner">読み込んでいます…</div>
  <div id="content" style="display:none;">

    <div class="kpi-row">
      <div class="kpi-tile">
        <div class="label">総不良個数</div>
        <div class="value mono" id="kpiDefectQty">0</div>
      </div>
      <div class="kpi-tile">
        <div class="label">不良件数</div>
        <div class="value mono" id="kpiIncidentCount">0</div>
      </div>
      <div class="kpi-tile">
        <div class="label">対象品番数</div>
        <div class="value mono" id="kpiZubanCount">0</div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2><span class="bar"></span>品番別 不良個数ランキング</h2>
      </div>
      <div id="zubanRanking"></div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2><span class="bar"></span>大分類別の内訳</h2>
      </div>
      <div id="categoryDonut"></div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2><span class="bar"></span>不良内容ランキング（詳細）</h2>
      </div>
      <div id="detailRanking"></div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2><span class="bar"></span>月別 不良個数の推移</h2>
      </div>
      <div id="monthlyChart"></div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2><span class="bar"></span>品番別 不良率</h2>
      </div>
      <p class="empty-note" style="padding-top:0;">不良率＝不良個数 ÷ 加工数スナップショットの完了数量。完了数量のデータが無い品番は「―」。</p>
      <div id="rateTable"></div>
    </div>

    <p class="foot-note">工程内不良ログ・加工数スナップショットを集計（ログイン不要の読み取り専用ページ）</p>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
  var GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzqgdS5B5jlg5M11acnfkQAhfk_8Rso7R70CQ37LGUqVMakL9MQva1Dn_sm8p3Upo-a/exec';
  var CATEGORY_COLOR = {
    '刃物欠け・折れ': 'var(--series-blade)',
    '寸法不良': 'var(--series-dim)',
    '外観不良': 'var(--series-look)',
    'その他': 'var(--series-other)'
  };
  var CATEGORY_ORDER = ['刃物欠け・折れ', '寸法不良', '外観不良', 'その他'];

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var tooltipEl = document.getElementById('tooltip');
  function showTooltip(evt, text) {
    tooltipEl.textContent = text;
    tooltipEl.classList.add('show');
    moveTooltip(evt);
  }
  function moveTooltip(evt) {
    var x = evt.clientX, y = evt.clientY;
    tooltipEl.style.left = Math.min(x + 14, window.innerWidth - 160) + 'px';
    tooltipEl.style.top = Math.max(y - 32, 8) + 'px';
  }
  function hideTooltip() { tooltipEl.classList.remove('show'); }

  // ==== 横棒ランキング（単一系列・sequential色、直接ラベル常時表示、ホバーで値、表切替） ====
  function buildBarRanking(container, rows, opts) {
    container.innerHTML = '';
    if (!rows.length) { container.innerHTML = '<p class="empty-note">データがありません</p>'; return; }
    var max = Math.max.apply(null, rows.map(function (r) { return r.qty; })) || 1;
    var chartDiv = document.createElement('div');
    rows.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'bar-row';
      var pct = Math.max((r.qty / max) * 100, 2);
      row.innerHTML =
        '<div class="bar-label" title="' + escapeHtml(r.label) + '">' + escapeHtml(r.label) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + opts.color + ';"></div></div>' +
        '<div class="bar-value mono">' + r.qty + '</div>';
      var fill = row.querySelector('.bar-fill');
      fill.addEventListener('mouseenter', function (e) { showTooltip(e, r.label + '：' + r.qty + '個' + (r.sub ? '（' + r.sub + '）' : '')); });
      fill.addEventListener('mousemove', moveTooltip);
      fill.addEventListener('mouseleave', hideTooltip);
      chartDiv.appendChild(row);
    });

    var tableDiv = document.createElement('div');
    tableDiv.style.display = 'none';
    var tableHtml = '<table class="data-table"><thead><tr><th>項目</th><th>個数</th></tr></thead><tbody>';
    rows.forEach(function (r) { tableHtml += '<tr><td>' + escapeHtml(r.label) + '</td><td class="mono">' + r.qty + '</td></tr>'; });
    tableHtml += '</tbody></table>';
    tableDiv.innerHTML = tableHtml;

    var toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'toggle-btn';
    toggle.textContent = '表で見る';
    toggle.style.marginBottom = '10px';
    toggle.addEventListener('click', function () {
      var showingTable = tableDiv.style.display !== 'none';
      tableDiv.style.display = showingTable ? 'none' : 'block';
      chartDiv.style.display = showingTable ? 'block' : 'none';
      toggle.textContent = showingTable ? '表で見る' : 'グラフで見る';
    });

    container.appendChild(toggle);
    container.appendChild(chartDiv);
    container.appendChild(tableDiv);
  }

  // ==== 円グラフ（大分類別、カテゴリカル4色、凡例＋直接%ラベル） ====
  function buildDonut(container, rows) {
    container.innerHTML = '';
    var total = rows.reduce(function (s, r) { return s + r.qty; }, 0);
    if (!total) { container.innerHTML = '<p class="empty-note">データがありません</p>'; return; }
    var ordered = CATEGORY_ORDER.map(function (cat) {
      var found = rows.filter(function (r) { return r.category === cat; })[0];
      return { category: cat, qty: found ? found.qty : 0 };
    }).filter(function (r) { return r.qty > 0; });

    var r = 70, cx = 90, cy = 90, inner = 40;
    var angle = -90;
    var paths = '';
    ordered.forEach(function (seg) {
      var sweep = (seg.qty / total) * 360;
      var x1 = cx + r * Math.cos(angle * Math.PI / 180);
      var y1 = cy + r * Math.sin(angle * Math.PI / 180);
      var endAngle = angle + sweep;
      var x2 = cx + r * Math.cos(endAngle * Math.PI / 180);
      var y2 = cy + r * Math.sin(endAngle * Math.PI / 180);
      var largeArc = sweep > 180 ? 1 : 0;
      var ix1 = cx + inner * Math.cos(angle * Math.PI / 180);
      var iy1 = cy + inner * Math.sin(angle * Math.PI / 180);
      var ix2 = cx + inner * Math.cos(endAngle * Math.PI / 180);
      var iy2 = cy + inner * Math.sin(endAngle * Math.PI / 180);
      var d = 'M' + x1 + ',' + y1 + ' A' + r + ',' + r + ' 0 ' + largeArc + ' 1 ' + x2 + ',' + y2 +
        ' L' + ix2 + ',' + iy2 + ' A' + inner + ',' + inner + ' 0 ' + largeArc + ' 0 ' + ix1 + ',' + iy1 + ' Z';
      paths += '<path d="' + d + '" fill="' + CATEGORY_COLOR[seg.category] + '" data-cat="' + escapeHtml(seg.category) +
        '" data-qty="' + seg.qty + '" stroke="var(--surface)" stroke-width="2"></path>';
      angle = endAngle;
    });

    var wrap = document.createElement('div');
    wrap.className = 'donut-wrap';
    var legendHtml = '<div class="legend">';
    ordered.forEach(function (seg) {
      var pct = Math.round((seg.qty / total) * 1000) / 10;
      legendHtml += '<div class="legend-item"><span class="legend-swatch" style="background:' + CATEGORY_COLOR[seg.category] + ';"></span>' +
        '<span class="name">' + escapeHtml(seg.category) + '</span><span class="pct mono">' + seg.qty + '個（' + pct + '%）</span></div>';
    });
    legendHtml += '</div>';
    wrap.innerHTML =
      '<svg viewBox="0 0 180 180" role="img" aria-label="大分類別の不良個数内訳">' + paths +
      '<text x="90" y="85" text-anchor="middle" font-size="11" fill="var(--ink-soft)">合計</text>' +
      '<text x="90" y="103" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)">' + total + '</text>' +
      '</svg>' + legendHtml;
    container.appendChild(wrap);

    wrap.querySelectorAll('path').forEach(function (p) {
      p.style.cursor = 'pointer';
      p.addEventListener('mouseenter', function (e) {
        showTooltip(e, p.getAttribute('data-cat') + '：' + p.getAttribute('data-qty') + '個');
        p.style.filter = 'brightness(1.18)';
      });
      p.addEventListener('mousemove', moveTooltip);
      p.addEventListener('mouseleave', function () { hideTooltip(); p.style.filter = ''; });
    });
  }

  // ==== 月別推移（単一系列バー、直接ラベル常時表示） ====
  function buildMonthlyChart(container, rows) {
    container.innerHTML = '';
    if (!rows.length) { container.innerHTML = '<p class="empty-note">データがありません</p>'; return; }
    var max = Math.max.apply(null, rows.map(function (r) { return r.defectQty; })) || 1;
    var chart = document.createElement('div');
    chart.className = 'month-chart';
    rows.forEach(function (r) {
      var h = Math.max((r.defectQty / max) * 100, r.defectQty > 0 ? 4 : 1);
      var col = document.createElement('div');
      col.className = 'month-col';
      var rateText = r.rate != null ? '（不良率 ' + (Math.round(r.rate * 1000) / 10) + '%）' : '';
      col.innerHTML =
        '<div class="val mono">' + r.defectQty + '</div>' +
        '<div class="bar" style="height:' + h + '%;background:var(--series-look);"></div>' +
        '<div class="label mono">' + r.month.slice(5) + '</div>';
      var bar = col.querySelector('.bar');
      bar.addEventListener('mouseenter', function (e) { showTooltip(e, r.month + '：不良' + r.defectQty + '個 / ' + r.incidentCount + '件' + rateText); });
      bar.addEventListener('mousemove', moveTooltip);
      bar.addEventListener('mouseleave', hideTooltip);
      chart.appendChild(col);
    });
    container.appendChild(chart);
  }

  // ==== 品番別不良率テーブル ====
  function buildRateTable(container, rows) {
    container.innerHTML = '';
    var withRate = rows.filter(function (r) { return r.completedQty > 0; });
    if (!rows.length) { container.innerHTML = '<p class="empty-note">データがありません</p>'; return; }
    var html = '<table class="data-table"><thead><tr><th>図番</th><th>品名</th><th>不良個数</th><th>完了数量</th><th>不良率</th></tr></thead><tbody>';
    rows.forEach(function (r) {
      var ratePct = r.rate != null ? (Math.round(r.rate * 1000) / 10) + '%' : '―';
      var rateClass = (r.rate != null && r.rate >= 0.1) ? ' rate-high' : '';
      html += '<tr><td class="zuban">' + escapeHtml(r.zuban) + '</td><td>' + escapeHtml(r.hinmei || '') + '</td>' +
        '<td class="mono">' + r.defectQty + '</td><td class="mono">' + (r.completedQty || '―') + '</td>' +
        '<td class="mono' + rateClass + '">' + ratePct + '</td></tr>';
    });
    html += '</tbody></table>';
    container.innerHTML = html;
    if (!withRate.length) {
      container.insertAdjacentHTML('afterbegin', '<p class="empty-note">完了数量のデータがまだ無いため、不良率は計算できていません。</p>');
    }
  }

  function render(data) {
    document.getElementById('statusBanner').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.getElementById('updatedAt').textContent = '取得: ' + new Date(data.generatedAt).toLocaleString('ja-JP');

    document.getElementById('kpiDefectQty').innerHTML = data.kpi.totalDefectQty + '<span class="unit">個</span>';
    document.getElementById('kpiIncidentCount').innerHTML = data.kpi.totalIncidentCount + '<span class="unit">件</span>';
    document.getElementById('kpiZubanCount').innerHTML = data.kpi.zubanCount + '<span class="unit">品番</span>';

    buildBarRanking(document.getElementById('zubanRanking'),
      data.byZuban.slice(0, 10).map(function (r) { return { label: r.zuban + (r.hinmei ? '　' + r.hinmei : ''), qty: r.defectQty, sub: r.incidentCount + '件' }; }),
      { color: 'var(--series-blade)' });

    buildDonut(document.getElementById('categoryDonut'), data.byCategory);

    buildBarRanking(document.getElementById('detailRanking'),
      data.byDetail.slice(0, 10).map(function (r) { return { label: r.detail, qty: r.qty, sub: r.category }; }),
      { color: 'var(--series-dim)' });

    buildMonthlyChart(document.getElementById('monthlyChart'), data.monthly);

    buildRateTable(document.getElementById('rateTable'), data.zubanRate);
  }

  fetch(GAS_API_URL + '?action=processDefectDashboard')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.error) { document.getElementById('statusBanner').textContent = '取得に失敗しました: ' + data.error; return; }
      render(data);
    })
    .catch(function (err) {
      document.getElementById('statusBanner').textContent = '取得に失敗しました: ' + err.message;
    });
</script>
</body>
</html>
